#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Chris Bracken"
email = "chris@bracken.jp"

[aliases]
l = ["log"]
ll = ["log", "-T", "builtin_log_oneline", "-r", "::"]
ld = ["log", "-T", "builtin_log_detailed ++ diff.stat() ++ '\n'", "-r", "::", "--no-graph"]
lp = ["log", "-T", "builtin_log_detailed ++ diff.stat() ++ '\n' ++ diff.git() ++ '\n'", "-r", "::", "--no-graph"]
format = ["util", "exec", "--", "jj-format"]

[ui]
diff-formatter = ":git"
revsets-use-glob-by-default = true

[revsets]
# Advance bookmarks to the most recent non-empty ancestor by default.
bookmark-advance-to = "latest(ancestors(.. ~ empty()) & ~empty())"
