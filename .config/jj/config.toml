#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Chris Bracken"
email = "chris@bracken.jp"

[aliases]
l = ["log", "-T", "fmt_lol", "-r", "ancestors(trunk() | mutable(), 3)"]
ll = ["log", "-T", "fmt_lol", "-r", "::"]

[ui]
diff-formatter = ":git"
revsets-use-glob-by-default = true

[template-aliases]
# Define the content format.
fmt_lol_content = '''
change_id.shortest(8) ++ " " ++
commit_id.shortest(8) ++ " " ++
label("timestamp", committer.timestamp().local().format("%Y-%m-%d %H:%M:%S")) ++ " " ++
label("author", author.name()) ++ "  " ++
separate(" ",
  bookmarks,
  tags,
  if(self.contained_in("first_parent(@)"), label("git_head", "git_head()")),
  if(empty, label("empty", "(empty)")),
  if(description, 
    description.first_line(), 
    label("description placeholder", "(no description set)")
  )
)
'''
# Wrap the content in the "working_copy" label if applicable.
fmt_lol = 'if(current_working_copy, label("working_copy", fmt_lol_content), fmt_lol_content)'

[colors]
"committer timestamp" = "cyan"
"working_copy committer timestamp" = "bright cyan"

[revsets]
# Advance bookmarks to the most recent non-empty ancestor by default.
bookmark-advance-to = "latest(ancestors(.. ~ empty()) & ~empty())"
