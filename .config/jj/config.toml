#:schema https://jj-vcs.github.io/jj/latest/config-schema.json

[user]
name = "Chris Bracken"
email = "chris@bracken.jp"

[aliases]
l = ["log"]
ll = ["log", "-T", "builtin_log_detailed ++ diff.stat() ++ '\n'", "-r", "::@ | @::", "--no-graph"]
lp = ["log", "-T", "builtin_log_detailed ++ diff.stat() ++ '\n' ++ diff.git() ++ '\n'", "-r", "::@ | @::", "--no-graph"]
lol = ["log", "-T", "builtin_log_oneline", "-r", "::"]
ws-add = ["util", "exec", "--", "jj-ws-add"]
ws-forget = ["util", "exec", "--", "jj-ws-forget"]

[ui]
diff-formatter = ":git"
revsets-use-glob-by-default = true

[revsets]
# Advance bookmarks to the most recent non-empty ancestor by default.
bookmark-advance-to = "latest(ancestors(.. ~ empty()) & ~empty())"

[fix.tools.clang-format]
command = ["clang-format", "--assume-filename=$path"]
patterns = ["glob:'**/*.c'", "glob:'**/*.cc'", "glob:'**/*.m'", "glob:'**/*.mm'"]

[fix.tools.dart]
command = ["dart", "format", "--output=show", "--stdin-name=$path"]
patterns = ["glob:'**/*.dart'"]

[fix.tools.gn]
command = ["gn", "format", "--stdin"]
patterns = ["glob:'**/*.gn'", "glob:'**/*.gni'"]

[fix.tools.swift-format]
command = ["swift-format", "format", "--assume-filename=$path", "-"]
patterns = ["glob:'**/*.swift'"]
